function readPref() { try { return JSON.parse(localStorage.getItem('schedule-book-ui') || '{}'); } catch (e) { return {}; } }
function writePref(v) { try { localStorage.setItem('schedule-book-ui', JSON.stringify(v)); } catch (e) { /* なし */ } }

function App() {
  var store = useStore();
  var pref = readPref();
  var tabS = useState(pref.tab || 'home'), tab = tabS[0];
  var viewS = useState(null), view = viewS[0]; // 'settings' | 'sleep'
  var dateS = useState(todayStr());
  var monthSel = useState(todayStr());
  var subs = useState({ monthly: pref.monthly || 'plan', time: pref.time || 'plan', todo: pref.todo || 'plan', health: pref.health || 'diet' });
  var sheet = useState(null);
  var toastS = useState(null);
  var toastTimer = useRef(null);
  function toast(msg) { toastS[1](msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(function () { toastS[1](null); }, 2400); }
  useEffect(function () { writePref({ tab: tab, monthly: subs[0].monthly, time: subs[0].time, todo: subs[0].todo, health: subs[0].health }); }, [tab, subs[0]]);
  useEffect(function () { window.scrollTo(0, 0); }, [tab, view]);
  function setSub(k, v) { var n = Object.assign({}, subs[0]); n[k] = v; subs[1](n); }
  function go(t) { viewS[1](null); tabS[1](t); }

  var s = store.state;
  var banner = s.mode === 'local' && html`<div class="banner">この端末だけに保存しています。PCとスマホで共有するには、設定から「Googleアカウントに保存する」を選んでください。</div>`;
  var errBanner = s.error && s.mode === 'db' && html`<div class="banner" role="alert">${s.error} <button class="btn small sub" onClick=${store.clearError}>閉じる</button></div>`;

  var common = {
    store: store, toast: toast,
    onGear: function () { viewS[1]('settings'); },
    onSleep: function () { setSub('health', 'sleep'); go('health'); },
    onDiet: function () { setSub('health', 'diet'); go('health'); },
    onEditEvent: function (date, ev) { sheet[1]({ type: 'event', date: date, event: ev }); },
    onNewEvent: function (date) { sheet[1]({ type: 'event', date: date, event: null }); },
    openTask: function (date, t) { sheet[1]({ type: 'task', date: date, task: t }); },
    openInbox: function (date, item) { sheet[1]({ type: 'inbox', date: date, item: item }); },
    openActual: function (date, a, p) { sheet[1]({ type: 'actual', date: date, actual: a && a.src === 'actual' ? a : null, fromPlan: p || null }); },
    openSleep: function (date, opts) { sheet[1]({ type: 'sleep', date: date, opts: opts || {} }); },
    openWork: function (date) { sheet[1]({ type: 'work', date: date }); }
  };

  var page;
  if (s.mode === 'loading') page = html`<div class="app"><div class="card"><div class="empty">${ART.calendar}<span>データを読み込んでいます…</span></div></div></div>`;
  else if (s.mode === 'signin' || s.mode === 'unconfigured') page = html`<${Login} store=${store} />`;
  else if (view === 'settings') page = html`<${Settings} ...${common} onBack=${function () { viewS[1](null); }} />`;
  else if (view === 'sleep') page = html`<${SleepLog} ...${common} onBack=${function () { viewS[1](null); }} />`;
  else if (tab === 'home') page = html`<${Home} ...${common} banner=${banner || errBanner} onTodo=${function () { dateS[1](todayStr()); go('todo'); }} />`;
  else if (tab === 'monthly') page = html`<${Monthly} ...${common} sub=${subs[0].monthly} setSub=${function (v) { setSub('monthly', v); }} selDate=${monthSel[0]} setSelDate=${monthSel[1]} onTimetable=${function (d) { dateS[1](d); setSub('time', 'plan'); go('time'); }} />`;
  else if (tab === 'time') page = html`<${Timetable} ...${common} sub=${subs[0].time} setSub=${function (v) { setSub('time', v); }} date=${dateS[0]} setDate=${dateS[1]} />`;
  else if (tab === 'health') page = html`<${Health} ...${common} sub=${subs[0].health} setSub=${function (v) { setSub('health', v); }} />`;
  else page = html`<${Todo} ...${common} sub=${subs[0].todo} setSub=${function (v) { setSub('todo', v); }} date=${dateS[0]} setDate=${dateS[1]} />`;

  var sh = sheet[0], close = function () { sheet[1](null); };
  var sheetEl = null;
  if (sh && s.mode !== 'loading') {
    if (sh.type === 'event') sheetEl = html`<${EventSheet} key=${'ev' + (sh.event ? sh.event.id : 'new') + sh.date} settings=${s.settings} days=${s.days} date=${sh.date} event=${sh.event} store=${store} toast=${toast} onClose=${close} />`;
    else if (sh.type === 'inbox') sheetEl = html`<${InboxSheet} key=${'ib' + (sh.item ? sh.item.id : 'new')} settings=${s.settings} date=${sh.date} item=${sh.item} store=${store} toast=${toast} onClose=${close} />`;
    else if (sh.type === 'task') sheetEl = html`<${TaskSheet} key=${'tk' + (sh.task ? sh.task.id : 'new')} settings=${s.settings} days=${s.days} date=${sh.date} task=${sh.task} store=${store} toast=${toast} onClose=${close} />`;
    else if (sh.type === 'actual') sheetEl = html`<${ActualSheet} settings=${s.settings} date=${sh.date} actual=${sh.actual} fromPlan=${sh.fromPlan} store=${store} toast=${toast} onClose=${close} />`;
    else if (sh.type === 'sleep') sheetEl = html`<${SleepSheet} key=${'sl' + sh.date} days=${s.days} date=${sh.date} opts=${sh.opts} store=${store} toast=${toast} onClose=${close} />`;
    else if (sh.type === 'work') sheetEl = html`<${WorkSheet} settings=${s.settings} date=${sh.date} store=${store} toast=${toast} onClose=${close} />`;
  }

  var tabs = [['home', 'ホーム', I.home], ['monthly', 'マンスリー', I.cal], ['time', '時間割', I.clock], ['todo', 'ToDo', I.list], ['health', 'ヘルス', I.heart]];
  return html`<div>
    ${tab !== 'home' && !view && (banner || errBanner) && html`<div style="max-width:520px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))">${banner || errBanner}</div>`}
    ${page}
    ${s.mode !== 'signin' && s.mode !== 'unconfigured' && html`<nav class="nav" aria-label="メイン"><div class="nav-inner">${tabs.map(function (t) {
      return html`<button aria-current=${!view && tab === t[0] ? 'page' : null} onClick=${function () { if (t[0] === 'time' || t[0] === 'todo') { if (tab !== t[0]) dateS[1](todayStr()); } go(t[0]); }}>${t[2]}${t[1]}</button>`;
    })}</div></nav>`}
    ${sheetEl}
    ${toastS[0] && html`<div class="toast" role="status">${toastS[0]}</div>`}
  </div>`;
}

render(html`<${App} />`, document.getElementById('app'));
})();
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>

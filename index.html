<style>
/* Layout: スマホ幅の1カラム。上にヘッダー、下に固定タブ。PCでは中央に最大520pxで表示 */
:root {
  --bg: #F4F5F8;
  --surface: #FFFFFF;
  --surface-2: #F1F2F6;
  --fg: #1C2230;
  --fg-2: #3A4354;
  --muted: #5F6B7D;
  --line: #E3E6EC;
  --line-2: #EEF0F4;
  --accent: #5A5FAA;
  --accent-ink: #FFFFFF;
  --accent-soft: #EEEFF7;
  --seg: #E7E8EF;
  --good: #23663E; --good-bg: #E3F1E8;
  --bad: #9E2F2F; --bad-bg: #F8E3E3;
  --warn: #6B4E00; --warn-bg: #FFF4DA; --warn-icon: #B07D00;
  --now: #B23B3B;
  --stripe-a: #F3F4F7; --stripe-b: #E8EAEF;
  --ink-dark: #1C2230;
  --shadow: 0 6px 16px rgba(90, 95, 170, 0.35);
  --scrim: rgba(28, 34, 48, 0.45);
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171E; --surface: #1D212B; --surface-2: #262B37; --fg: #E8EAF0; --fg-2: #C5CAD6; --muted: #98A1B3;
    --line: #2F3542; --line-2: #282D39; --accent: #9A9EE0; --accent-ink: #14171E; --accent-soft: #2A2D45; --seg: #2A2F3B;
    --good: #7FD3A0; --good-bg: #1F3328; --bad: #F2A0A0; --bad-bg: #3A2224;
    --warn: #F5D27A; --warn-bg: #3A3220; --warn-icon: #F5C24A; --now: #F27A7A;
    --stripe-a: #252A35; --stripe-b: #2E3441; --shadow: 0 6px 16px rgba(0, 0, 0, 0.45); --scrim: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171E; --surface: #1D212B; --surface-2: #262B37; --fg: #E8EAF0; --fg-2: #C5CAD6; --muted: #98A1B3;
  --line: #2F3542; --line-2: #282D39; --accent: #9A9EE0; --accent-ink: #14171E; --accent-soft: #2A2D45; --seg: #2A2F3B;
  --good: #7FD3A0; --good-bg: #1F3328; --bad: #F2A0A0; --bad-bg: #3A2224;
  --warn: #F5D27A; --warn-bg: #3A3220; --warn-icon: #F5C24A; --now: #F27A7A;
  --stripe-a: #252A35; --stripe-b: #2E3441; --shadow: 0 6px 16px rgba(0, 0, 0, 0.45); --scrim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.app { max-width: 520px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.tight { padding: 10px 12px; gap: 8px; }
.label { font-size: 12px; color: var(--muted); font-weight: 500; }
.h2 { font-size: 15px; font-weight: 700; margin: 0; }
.section-title { font-size: 13px; font-weight: 700; color: var(--fg-2); margin: 4px 0 0; }
.big { font-family: var(--font-num); font-size: 26px; font-weight: 600; line-height: 1.1; }
.big small { font-size: 15px; }
.chip-good { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--good-bg); color: var(--good); }
.chip-bad { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--bad-bg); color: var(--bad); }
.t-good { color: var(--good); } .t-bad { color: var(--bad); }
.bar { height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 3px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.datenav { display: flex; align-items: center; margin-left: -10px; min-width: 0; }
.datenav .title { font-size: 20px; font-weight: 700; white-space: nowrap; }
.iconbtn { width: 44px; height: 44px; border: none; border-radius: 22px; background: var(--surface); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn.plain { background: transparent; color: var(--fg-2); width: 40px; font-size: 20px; }
.todaybtn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--fg-2); }

/* Segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--seg); border-radius: 10px; padding: 3px; }
.seg button { border: none; border-radius: 8px; background: transparent; padding: 8px 0; font-size: 13px; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 700; color: var(--fg); }

/* Bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav-inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.nav button { border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.fab { position: fixed; z-index: 15; right: max(20px, calc(50% - 240px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 28px; border: none; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }

/* Calendar */
.cal { background: var(--surface); border-radius: 14px; padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-head span { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.cal-head span:first-child { color: var(--now); }
.cal-head span:last-child { color: #3F57A6; }
.cell { min-height: 64px; border-radius: 8px; border: 2px solid transparent; background: transparent; padding: 3px; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; }
.cell.sel { background: var(--accent-soft); }
.cell.today { border-color: var(--accent); }
.cell.out { opacity: 0.35; }
.cell .d { font-family: var(--font-num); font-size: 11px; font-weight: 600; }
.cell .d.sun { color: var(--now); } .cell .d.sat { color: #3F57A6; }
.cell .ev { font-size: 9px; line-height: 1.35; border-radius: 3px; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--c) 25%, var(--surface)); border-left: 3px solid var(--c); }
.cell .sl { font-family: var(--font-num); font-size: 10px; color: var(--fg-2); }
.cell .note { font-size: 9px; line-height: 1.35; background: color-mix(in srgb, #E8C55A 30%, var(--surface)); border-radius: 3px; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.more { font-size: 9px; color: var(--muted); }

/* Lists */
.item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; border: none; background: var(--surface); text-align: left; width: 100%; min-width: 0; }
.item .grow { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; }
.item .title { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.item .sub { font-family: var(--font-num); font-size: 11px; color: var(--muted); }
.box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--c); background: var(--surface); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
.box.on { background: var(--c); }
.item.done .title { text-decoration: line-through; color: var(--muted); }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); border: 1px solid var(--c); white-space: nowrap; flex: none; }
.evrow { display: flex; gap: 10px; align-items: stretch; border: none; background: transparent; padding: 0; text-align: left; width: 100%; }
.evrow .time { font-family: var(--font-num); font-size: 12px; width: 84px; color: var(--fg-2); padding-top: 4px; flex: none; }
.evrow .body { flex-grow: 1; min-width: 0; border-radius: 10px; padding: 7px 12px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); border-left: 4px solid var(--c); display: flex; flex-direction: column; }
.evrow .body b { font-size: 14px; overflow-wrap: anywhere; }
.evrow .body span { font-size: 11px; color: var(--fg-2); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 8px; text-align: center; color: var(--muted); font-size: 13px; }

/* Timeline */
.tl { position: relative; background: var(--surface); border-radius: 14px; overflow: hidden; }
.tl .hl { position: absolute; left: 8px; font-family: var(--font-num); font-size: 10px; color: var(--muted); transform: translateY(-50%); }
.tl .hr { position: absolute; left: 46px; right: 8px; border-top: 1px solid var(--line-2); }
.blk { position: absolute; border-radius: 6px; padding: 2px 6px; overflow: hidden; border: none; text-align: left; display: flex; flex-direction: column; line-height: 1.25; color: var(--fg); }
.blk b { font-size: 12px; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk span { font-family: var(--font-num); font-size: 10px; white-space: nowrap; }
.blk.plan { background: color-mix(in srgb, var(--c) 22%, var(--surface)); border-left: 4px solid var(--c); }
.blk.plan.dashed { border: 1.5px dashed var(--c); }
.blk.act { background: var(--c); color: var(--ink); }
.blk.base { background: repeating-linear-gradient(135deg, var(--stripe-a) 0 6px, var(--stripe-b) 6px 12px); border-left: 4px solid var(--c); color: var(--fg); }
.blk.base.dashed { border: 1.5px dashed var(--c); }
.blk.same.plan { background: var(--surface); border: 1.5px solid var(--c); border-left-width: 4px; box-shadow: 0 2px 8px rgba(28, 34, 48, 0.18); }
.blk.same.act { box-shadow: 0 0 0 2px var(--surface), 0 3px 8px rgba(28, 34, 48, 0.25); }
.blk.inner { box-shadow: 0 0 0 2px var(--surface); }
.band { position: absolute; width: 8px; border-radius: 4px; background: var(--c); border: none; padding: 0; }
.bandlabel { position: absolute; font-size: 10px; font-weight: 700; color: var(--fg); background: color-mix(in srgb, var(--c) 30%, var(--surface)); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.mark { position: absolute; border-top: 2px dashed var(--accent); z-index: 5; pointer-events: none; }
.mark.solid { border-top-style: solid; }
.mark span { position: absolute; left: 0; top: -10px; font-size: 10px; font-weight: 700; color: var(--accent); background: var(--surface); padding: 0 4px; white-space: nowrap; }
.nowline { position: absolute; border-top: 2px solid var(--now); z-index: 6; pointer-events: none; }
.nowline span { position: absolute; right: 12px; top: -9px; font-family: var(--font-num); font-size: 10px; font-weight: 600; color: var(--now); background: var(--surface); padding: 0 4px; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); border: none; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.grab { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line); flex: none; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.input { font-size: 16px; color: var(--fg); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); width: 100%; min-width: 0; }
textarea.input { min-height: 90px; resize: vertical; line-height: 1.6; }
.timein { font-family: var(--font-num); font-size: 16px; font-weight: 600; border: none; background: var(--surface-2); border-radius: 8px; padding: 6px 8px; color: var(--fg); }
.group { border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; }
.group > * { padding: 10px 12px; border-bottom: 1px solid var(--line-2); }
.group > *:last-child { border-bottom: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 22%, var(--surface)); font-weight: 700; }
.chip .dot { width: 10px; height: 10px; border-radius: 5px; background: var(--c); }
.chip .min { font-family: var(--font-num); font-size: 11px; color: var(--muted); font-weight: 500; }
.btn { border: none; border-radius: 12px; padding: 13px 0; font-size: 15px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.sub { background: var(--surface-2); color: var(--fg); font-weight: 500; }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.small { padding: 7px 12px; font-size: 12px; border-radius: 999px; }
.btn.ghost { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }
.btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.switch { width: 46px; height: 28px; border-radius: 14px; border: none; background: var(--line); position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; transition: left 0.15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 21px; }
.warnbox { display: flex; gap: 8px; align-items: flex-start; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5; }
.okbox { display: flex; gap: 8px; align-items: flex-start; background: var(--good-bg); color: var(--good); border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5; }
.stepper { width: 32px; height: 32px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; color: var(--fg-2); flex: none; }
.banner { font-size: 12px; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 8px 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 13px; }
.swatch { width: 30px; height: 30px; border-radius: 15px; border: none; background: var(--c); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* ---------- 共通部品 ---------- */
function Sheet(props) {

  return html`<div>

    <div class="sheet" role="dialog" aria-modal="true" aria-label=${props.title}>
      <div class="grab"></div>

    </div>
  </div>`;
}
function Seg(props) {

    return html`<button aria-pressed=${String(props.value === o[0])} onClick=${function () { props.onChange(o[0]); }}>${o[1]}</button>`;
  })}</div>`;
}
function Switch(props) {

}
function Gear(props) { return html`<button class="iconbtn" aria-label="設定" onClick=${props.onClick}>${I.gear}</button>`; }
function DateNav(props) {
  var isToday = props.date === todayStr();
  return html`<div class="top">
    <div class="datenav">
      <button class="iconbtn plain" aria-label="前の日" onClick=${function () { props.onChange(addDays(props.date, -1)); }}>‹</button>

    </div>
    <${Gear} onClick=${props.onGear} />
  </div>`;
}
function CatChips(props) {
  var cm = catMap(props.settings);
  var tops = props.settings.cats.filter(function (c) { return !c.parent; });
  var cur = cm[props.value];
  var curRoot = cur ? (cur.parent || cur.id) : null;

    <div class="chips">${tops.map(function (c) {
      return html`<button class="chip" style=${'--c:' + c.color} aria-pressed=${String(curRoot === c.id)} onClick=${function () {
        var s = props.settings.cats.filter(function (x) { return x.parent === c.id; });
        props.onChange(s.length ? s[0].id : c.id);
      }}><span class="dot"></span>${c.name}</button>`;
    })}</div>
    ${subs.length > 0 && html`<div class="stack" style="background:var(--surface-2);border-radius:12px;padding:10px">
      <span class="label">${cm[curRoot].name}の種類</span>
      <div class="chips">${subs.map(function (c) {
        return html`<button class="chip" style=${'--c:' + c.color} aria-pressed=${String(props.value === c.id)} onClick=${function () { props.onChange(c.id); }}><span class="dot"></span>${c.name}</button>`;

}
function ConflictNote(props) {

}
function Ring(props) {
  var circ = 2 * Math.PI * 23, frac = props.total ? props.done / props.total : 0;
  return html`<svg width="58" height="58" viewBox="0 0 58 58" role="img" aria-label=${props.total + '件中' + props.done + '件完了'}>

    <text x="29" y="34" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="var(--fg)">${props.done}/${props.total}</text>

function tagsOf(settings, ev) {

}

/* ---------- ホーム ---------- */
function Home(props) {

  var stats = taskStats(day);
  var hour = new Date().getHours();
  var greet = hour < 5 ? 'こんばんは' : hour < 11 ? 'おはようございます' : hour < 18 ? 'こんにちは' : 'こんばんは';
  var events = day.events.slice().sort(function (a, b) { return (a.allDay ? -1 : toMin(a.start)) - (b.allDay ? -1 : toMin(b.start)); });
  var next = null;
  for (var i = 1; i <= 90 && !next; i++) {
    var dd = addDays(t, i), d = s.days[dd];

  return html`<div class="app">

        <span style="font-size:13px;color:var(--fg-2)">${greet}</span>
      </div>

    </div>

        <span class="between label">昨日の睡眠<span style="color:var(--accent);font-weight:700">記録 ›</span></span>
        <span class="between"><span class="big">${sl ? html`${Math.floor(sl.min / 60)}<small>h</small>${pad(sl.min % 60)}<small>m</small>` : '--'}</span>${ART.moon}</span>
        ${sl ? html`<span style="font-size:12px;font-weight:500" class=${sl.min >= goal.min ? 't-good' : 't-bad'}>目標より ${signed(sl.min - goal.min)}</span>
          <div class="bar"><div style=${'width:' + clamp(sl.min / goal.min * 100, 0, 100) + '%'}></div></div>
          <span class="num muted" style="font-size:11px">${hm(clockOf(sl.bed))} → ${hm(clockOf(sl.wake))}${sl.wakeUps ? '・途中で起きた' + sl.wakeUps + '回' : ''}</span>`
        : html`<span class="muted" style="font-size:12px">ホームの「寝る」「起きた」を押すと記録されます</span>`}
      </button>
      <button class="card" style="border:none;text-align:left;gap:6px" onClick=${props.onTodo}>
        <span class="label">今日のToDo</span>
        <span class="between"><span style="font-size:14px;line-height:1.1">あと<span class="big" style="margin:0 2px">${stats.total - stats.done}</span>件</span>${ART.clip}</span>
        <span class="muted" style="font-size:12px">${stats.total}件中 ${stats.done}件完了</span>
        <div class="bar"><div style=${'width:' + (stats.total ? stats.done / stats.total * 100 : 0) + '%'}></div></div>

        ${(s.inbox || []).filter(function (x) { return !x.done; }).length > 0 && html`<span class="muted" style="font-size:11px">いつかやる ${(s.inbox || []).filter(function (x) { return !x.done; }).length}件</span>`}
      </button>

  </div>`;

/* 寝る・起きたボタン（ホーム） */
function SleepButtons(props) {
  var s = props.store.state;
  var openSleep = findOpenSleep(s.days);
  function pressBed() {
    var now = Date.now(), sd = sleepDayFor(now);
    props.store.setDay(sd, function (d) { d.sleeps = (d.sleeps || []).concat([{ id: uid(), bed: now, wake: null }]); return d; });
    props.toast('就寝 ' + hm(nowMin()) + ' を記録しました');
  }
  function pressWake() {
    if (!openSleep) { props.openSleep(todayStr(), { wakeNow: true }); return; }
    var now = Date.now(), o = openSleep;
    props.store.setDay(o.date, function (d) { (d.sleeps || []).forEach(function (g) { if (g.id === o.seg.id) g.wake = now; }); return d; });
    props.toast('起床 ' + hm(nowMin()) + ' を記録しました');
  }
  return html`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <button class="card tight" style=${'border:none;flex-direction:row;align-items:center;gap:10px;text-align:left;' + (openSleep ? 'background:#F6D77A;color:#1C2230' : 'background:color-mix(in srgb,#F6D77A 30%,var(--surface))')} onClick=${pressWake}>
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="7" fill=${openSleep ? '#FFFFFF' : '#F6D77A'}></circle><g fill=${openSleep ? '#FFFFFF' : '#F6D77A'}><rect x="13" y="1" width="2" height="4" rx="1"></rect><rect x="13" y="23" width="2" height="4" rx="1"></rect><rect x="1" y="13" width="4" height="2" rx="1"></rect><rect x="23" y="13" width="4" height="2" rx="1"></rect></g></svg>
          <span class="stack" style="gap:0"><span style="font-size:14px;font-weight:700">起きた</span><span style="font-size:11px">${openSleep ? hm(clockOf(openSleep.seg.bed)) + 'から睡眠中' : '押した時刻を記録'}</span></span>
        </button>
        <button class="card tight" style=${'border:none;flex-direction:row;align-items:center;gap:10px;text-align:left;background:var(--accent);color:var(--accent-ink);' + (openSleep ? 'opacity:.5' : '')} disabled=${!!openSleep} onClick=${pressBed}>
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M15 4a10 10 0 1 0 9 14A8.5 8.5 0 0 1 15 4z" fill="#F3D27A"></path></svg>
          <span class="stack" style="gap:0"><span style="font-size:14px;font-weight:700">寝る</span><span style="font-size:11px">${openSleep ? '「起きた」を押すと終わります' : '二度寝のときももう一度押す'}</span></span>

}

/* ---------- マンスリー ---------- */
function monthCells(y, m) {
  var first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  var cells = [];
  for (var i = 0; i < 42; i++) { var d = new Date(start); d.setDate(start.getDate() + i); cells.push({ date: ymd(d), out: d.getMonth() !== m, dow: d.getDay(), n: d.getDate() }); }
  if (cells.slice(35).every(function (c) { return c.out; })) cells = cells.slice(0, 35);
  return cells;
}
function Monthly(props) {
  var s = props.store.state, settings = s.settings, cm = catMap(settings);
  var sel = props.selDate, setSel = props.setSelDate;
  var ym = useState(function () { var d = parse(sel); return [d.getFullYear(), d.getMonth()]; });
  var y = ym[0][0], m = ym[0][1];
  function move(n) { var d = new Date(y, m + n, 1); ym[1]([d.getFullYear(), d.getMonth()]); }
  var cells = monthCells(y, m);
  var t = todayStr();
  var day = getDay(s.days, sel);
  var sleeps = cells.filter(function (c) { return !c.out; }).map(function (c) { var x = sleepFor(s.days, c.date); return x ? x.min : null; }).filter(function (v) { return v != null; });
  var monthAvg = avg(sleeps);
  var noteState = useState(null); var editingNote = noteState[0], setEditingNote = noteState[1];
  var tagFilter = useState(null);
  function passTag(e) { return !tagFilter[0] || ((e.tags || []).indexOf(tagFilter[0]) !== -1); }
  var allTags = settings.tags || [];

  return html`<div class="app">
    <div class="top">
      <div class="datenav">
        <button class="iconbtn plain" aria-label="前の月" onClick=${function () { move(-1); }}>‹</button>
        <span class="title" style="font-size:22px">${y}年 ${m + 1}月</span>
        <button class="iconbtn plain" aria-label="次の月" onClick=${function () { move(1); }}>›</button>
      </div>

/* ---------- 時間割 ---------- */
function layoutColumn(cm, items, opts) {

  items.forEach(function (it) {

    else rest.push(it);

  var out = [];
  bases.forEach(function (b) { out.push({ it: b, role: 'base', left: opts.left, width: opts.width }); });
  rest.sort(function (a, b) { return a.start - b.start || b.end - a.end; });
  var clusters = [], cur = null;
  rest.forEach(function (it) {
    if (!cur || it.start >= cur.end) { cur = { items: [], end: it.end }; clusters.push(cur); }
    cur.items.push(it); cur.end = Math.max(cur.end, it.end);
  });
  clusters.forEach(function (cl) {
    var lanes = [];
    cl.items.forEach(function (it) {
      var li = lanes.findIndex(function (end) { return end <= it.start; });
      if (li === -1) { li = lanes.length; lanes.push(it.end); } else lanes[li] = it.end;
      it._lane = li;
    });
    var n = lanes.length;
    cl.items.forEach(function (it) {
      var inBase = bases.some(function (b) { return b.start < it.end && it.start < b.end; });
      var off = inBase ? opts.width * 0.16 : 0;
      var w = (opts.width - off) / n;
      var sameBase = inBase && bases.some(function (b) { return rootOf(cm, b.cat).id === rootOf(cm, it.cat).id; });
      out.push({ it: it, role: sameBase ? 'same' : (inBase ? 'inner' : ''), left: opts.left + off + w * it._lane, width: w - 2 });
    });
  });
  return { blocks: out, bands: bands };
}
function Timeline(props) {

function Timetable(props) {

      <button class="card tight" style="border:none;text-align:left;gap:6px" onClick=${function () { props.openSleep(date); }}>

        ${sl ? html`<span style="font-size:13px"><span class="num" style="font-size:18px;font-weight:600">${dur(sl.min)}</span>${sl.wakeUps ? html`<span class="muted" style="margin-left:8px">途中で起きた ${sl.wakeUps}回（${dur(sl.awake)}）</span>` : ''}</span>` : html`<span class="muted" style="font-size:12px">${segsHere.length ? '起きた時刻を記録すると計算されます' : 'まだ記録がありません'}</span>`}
        ${segsHere.length > 0 && html`<span class="stack" style="gap:2px">${segsHere.map(function (g, i) {
          return html`<span class="num" style="font-size:12px;color:var(--fg-2)">${i + 1}回目　${hm(clockOf(g.bed))} → ${g.wake ? hm(clockOf(g.wake)) + '（' + dur((g.wake - g.bed) / 60000) + '）' : '睡眠中'}</span>`;
        })}</span>`}
      </button>
      ${pending.length > 0 && html`<div class="card tight">
        <span class="label">まだ記録していない予定</span>
        ${pending.map(function (p) {
          return html`<div class="row" style="gap:8px">
            <span style=${'width:4px;align-self:stretch;border-radius:2px;background:' + colorOf(cm, p.cat)}></span>
            <span class="stack" style="gap:0;flex-grow:1;min-width:0"><span style="font-size:13px;font-weight:700;overflow-wrap:anywhere">${p.title}</span><span class="num muted" style="font-size:11px">${hm(p.start)}–${hm(p.end)}</span></span>
            <button class="btn small" onClick=${function () { recordAsPlanned(p); }}>予定どおり</button>
            <button class="btn small sub" style="border:1.5px solid var(--line)" onClick=${function () { props.openActual(date, null, p); }}>時間を入れる</button>
          </div>`;
        })}
      </div>`}
      ${acts.length || sleepBlocks.length || marksAct.length ? html`<${Timeline} cm=${cm} columns=${[{ items: acts.concat(sleepBlocks), kind: 'act' }]} marks=${marksAct} now=${nm} onBlock=${onBlock} />`
        : html`<div class="card"><div class="empty">${ART.sleepy}<span>まだ実績はありません。右下の＋か「予定どおり」で記録できます。</span></div></div>`}`;
  } else {
    var sum = {};
    function add(list, k) { list.forEach(function (it) { var r = rootOf(cm, it.cat); if (r.rule === 'always') return; sum[r.id] = sum[r.id] || { plan: 0, act: 0, cat: r }; sum[r.id][k] += it.end - it.start; }); }
    // 仕事の枠は中の予定ぶんを引いて数える
    function adjusted(list) {
      var base = list.filter(function (x) { return x.src === 'work' || x.link === 'work'; });
      return list.map(function (it) {
        if (base.indexOf(it) === -1) return it;
        var inner = list.filter(function (o) { return base.indexOf(o) === -1 && rootOf(cm, o.cat).id !== rootOf(cm, it.cat).id && o.start < it.end && it.start < o.end; });
        var cut = inner.reduce(function (a, o) { return a + (Math.min(o.end, it.end) - Math.max(o.start, it.start)); }, 0);
        return Object.assign({}, it, { end: it.end - cut });
      });
    }
    add(adjusted(plan.filter(function (p) { return p.src !== 'task'; })), 'plan'); add(adjusted(acts), 'act');
    var rows = Object.keys(sum).map(function (k) { return sum[k]; });
    var sl2 = sleepFor(s.days, date);
    rows.push({ cat: { name: '睡眠', color: '#5A5FAA' }, plan: goal.min, act: sl2 ? sl2.min : 0, sleep: true, missing: !sl2 });
    var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r.plan, r.act); }).concat([60]));
    var missing = plan.filter(function (p) { return p.src !== 'task' && !recorded[p.key] && !isBand(cm, p.cat) && (isPast || (isToday && p.end <= nowMin())); });
    body = html`
      <div class="card tight">
        <div class="between"><span class="h2" style="font-size:14px">カテゴリ別の時間</span>
          <span class="row" style="gap:10px;font-size:10px;color:var(--fg-2)"><span class="row" style="gap:4px"><span style="width:12px;height:6px;border-radius:3px;border:1.5px dashed var(--muted)"></span>予定</span><span class="row" style="gap:4px"><span style="width:12px;height:6px;border-radius:3px;background:var(--muted)"></span>実績</span></span></div>
        ${rows.map(function (r) {
          var d = r.act - r.plan;
          return html`<div style="display:grid;grid-template-columns:44px minmax(0,1fr) 104px;align-items:center;gap:8px">
            <span style="font-size:12px;font-weight:500">${r.cat.name}</span>
            <span class="stack" style="gap:3px"><span style=${'height:7px;border-radius:4px;border:1.5px dashed ' + r.cat.color + ';width:' + Math.max(2, r.plan / max * 100) + '%'}></span><span style=${'height:7px;border-radius:4px;background:' + r.cat.color + ';width:' + (r.act / max * 100) + '%'}></span></span>
            <span class="num" style="font-size:11px;text-align:right;white-space:nowrap">${r.missing ? '未記録' : dur(r.act)} ${!r.missing && html`<span style="font-weight:600" class=${d >= 0 ? 't-good' : 't-bad'}>${(d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(Math.round(d))}分</span>`}</span>
          </div>`;
        })}
        ${missing.length > 0 && html`<span style="font-size:12px" class="t-bad">記録なし：${missing.map(function (p) { return p.title; }).join('、')}</span>`}
      </div>
      <${Timeline} cm=${cm} compact=${true} dashed=${true} columns=${[{ items: plan, kind: 'plan', label: '予定' }, { items: acts.concat(sleepBlocks), kind: 'act', label: '実績' }]}
        marks=${[{ min: toMin(goal.wake), col: 0 }].concat(wakeMs && !hasSegs ? [{ min: clockOf(wakeMs), col: 1, solid: true }] : [])} now=${nm} onBlock=${onBlock} />`;
  }

  return html`<div class="app">
    <${DateNav} date=${date} onChange=${props.setDate} onGear=${props.onGear} />
    <${Seg} label="表示" value=${props.sub} onChange=${props.setSub} options=${[['plan', '予定'], ['actual', '実績'], ['compare', '比較']]} />
    ${body}
    ${props.sub !== 'compare' && html`<button class="fab" aria-label=${props.sub === 'plan' ? '予定を追加' : '実績を記録'} onClick=${function () { props.sub === 'plan' ? props.onNewEvent(date) : props.openActual(date, null, null); }}>${I.plus}</button>`}
  </div>`;
}

/* 実績の追加・編集 */
function ActualSheet(props) {
  var settings = props.settings, cm = catMap(settings);
  var a = props.actual, p = props.fromPlan;
  var init = a ? { title: a.title, cat: a.cat, start: hm2(a.start), end: hm2(a.end) } : p ? { title: p.title, cat: p.cat, start: hm2(p.start), end: hm2(p.end) } : { title: '', cat: 'other', start: hm2(Math.max(0, nowMin() - 60)), end: hm2(nowMin()) };
  var f = useState(init), v = f[0], set = function (k, val) { var n = Object.assign({}, v); n[k] = val; f[1](n); };
  var del = useState(false);
  function save() {
    if (!v.title.trim()) return;
    props.store.setDay(props.date, function (d) {
      if (a) d.actuals.forEach(function (x) { if (x.id === a.id) { x.title = v.title.trim(); x.cat = v.cat; x.start = v.start; x.end = v.end; } });
      else {
        d.actuals.push({ id: uid(), link: p ? p.key : null, title: v.title.trim(), cat: v.cat, start: v.start, end: v.end });
        if (p && p.src === 'task') d.tasks.forEach(function (t) { if (t.id === p.id) { t.done = true; t.doneAt = Date.now(); } });
      }
      return d;
    });
    props.toast('実績を保存しました'); props.onClose();
  }
  function remove() {
    props.store.setDay(props.date, function (d) {
      d.actuals = d.actuals.filter(function (x) { return x.id !== a.id; });
      if (a.link && a.link.indexOf('t:') === 0) d.tasks.forEach(function (t) { if ('t:' + t.id === a.link) { t.done = false; t.doneAt = null; } });
      return d;
    });
    props.toast('実績を削除しました'); props.onClose();
  }
  return html`<${Sheet} title="実績" onClose=${props.onClose}>
    <h2 class="h2" style="font-size:18px">${a ? '実績を編集' : '実績を記録'}</h2>
    ${p && html`<p class="muted" style="margin:0;font-size:12px">予定：${hm(p.start)}〜${hm(p.end)}</p>`}
    <label class="field" for="ac-title">何をしたか<input id="ac-title" class="input" value=${v.title} onInput=${function (e) { set('title', e.target.value); }} placeholder="例：資格講座" /></label>
    <div class="group"><div class="between"><span style="font-size:14px">実際の時間</span><span class="row" style="gap:6px">
      <label class="sr" for="ac-start">開始</label><input id="ac-start" type="time" class="timein" value=${v.start} onChange=${function (e) { if (e.target.value) set('start', e.target.value); }} />
      <span class="muted">〜</span>
      <label class="sr" for="ac-end">終了</label><input id="ac-end" type="time" class="timein" value=${v.end} onChange=${function (e) { if (e.target.value) set('end', e.target.value); }} />
    </span></div></div>
    <div class="stack"><span class="label">カテゴリ</span><${CatChips} settings=${settings} value=${v.cat} onChange=${function (c) { set('cat', c); }} /></div>
    <div class="btns"><button class="btn sub" onClick=${props.onClose}>キャンセル</button><button class="btn" style=${v.title.trim() ? '' : 'opacity:.5'} onClick=${save}>保存</button></div>
    ${a && (del[0] ? html`<div class="btns"><button class="btn sub" onClick=${function () { del[1](false); }}>やめる</button><button class="btn danger" onClick=${remove}>本当に削除する</button></div>` : html`<button class="btn danger" onClick=${function () { del[1](true); }}>この実績を削除</button>`)}
  </${Sheet}>`;
}

/* 睡眠の記録を直す（寝た〜起きたを何回でも） */
function msFromTime(date, t, isBed) {
  var m = toMin(t); if (m == null) return null;
  var base = parse(date);
  if (isBed && m >= 18 * 60) base.setDate(base.getDate() - 1);
  base.setHours(Math.floor(m / 60), m % 60, 0, 0);
  return base.getTime();
}
function SleepSheet(props) {
  var day = getDay(props.days, props.date), prev = getDay(props.days, addDays(props.date, -1));
  var init = segsOf(day).slice().sort(function (a, b) { return (a.bed || 0) - (b.bed || 0); }).map(function (g) { return { id: g.id, bed: g.bed ? hm2(clockOf(g.bed)) : '', wake: g.wake ? hm2(clockOf(g.wake)) : '' }; });
  if (!init.length && day.wake && prev.bed) init = [{ id: uid(), bed: hm2(clockOf(prev.bed)), wake: hm2(clockOf(day.wake)) }];
  if (!init.length) init = [{ id: uid(), bed: '', wake: props.opts && props.opts.wakeNow ? hm2(nowMin()) : '' }];
  var rowsS = useState(init), rows = rowsS[0];
  function setRow(i, k, v) { var n = rows.map(function (r) { return Object.assign({}, r); }); n[i][k] = v; rowsS[1](n); }
  function addRow() {
    var last = rows[rows.length - 1];
    var b = last && last.wake ? hm2(toMin(last.wake) + 30) : '';
    rowsS[1](rows.concat([{ id: uid(), bed: b, wake: '' }]));
  }
  function delRow(i) { rowsS[1](rows.filter(function (_, j) { return j !== i; })); }
  var calc = rows.map(function (r) {
    var b = r.bed ? msFromTime(props.date, r.bed, true) : null, w = r.wake ? msFromTime(props.date, r.wake, false) : null;
    var bad = b != null && w != null && w <= b;
    return { b: b, w: w, bad: bad, min: b != null && w != null && !bad ? (w - b) / 60000 : null };
  });
  var total = calc.reduce(function (a, c) { return a + (c.min || 0); }, 0);
  var anyBad = calc.some(function (c) { return c.bad; });
  var sorted = calc.filter(function (c) { return c.b != null; }).sort(function (a, b) { return a.b - b.b; });
  var overlap = sorted.some(function (c, i) { return i > 0 && sorted[i - 1].w != null && c.b < sorted[i - 1].w; });
  function save() {
    if (anyBad || overlap) return;
    var segs = rows.map(function (r, i) { return { id: r.id, bed: calc[i].b, wake: calc[i].w }; }).filter(function (g) { return g.bed != null; });
    props.store.setDay(props.date, function (d) { d.sleeps = segs; return d; });
    props.toast('睡眠を保存しました'); props.onClose();
  }
  return html`<${Sheet} title="睡眠" onClose=${props.onClose}>
    <h2 class="h2" style="font-size:18px">${jpDate(props.date)}の睡眠</h2>
    <p class="muted" style="margin:0;font-size:12px;line-height:1.6">前の夜から朝までの睡眠です。途中で起きて作業し、また寝たときは「＋ 二度寝を追加」で行を分けます。寝ていた時間の合計が睡眠時間になります。18時以降に寝た時刻は前日の夜として数えます。</p>
    <div class="group">
      ${rows.map(function (r, i) {
        var c = calc[i];
        return html`<div class="stack" style="gap:6px">
          <div class="between"><span style="font-size:13px;font-weight:700">${i + 1}回目</span>
            <span class="row" style="gap:8px"><span class=${'num ' + (c.bad ? 't-bad' : 'muted')} style="font-size:12px">${c.bad ? '起きた時刻が寝た時刻より前です' : c.min != null ? dur(c.min) : (c.b != null && !c.w ? '睡眠中' : '')}</span>
            ${rows.length > 1 && html`<button class="stepper" aria-label=${(i + 1) + '回目を削除'} style="color:var(--bad)" onClick=${function () { delRow(i); }}>×</button>`}</span></div>
          <div class="row" style="flex-wrap:wrap;gap:8px">
            <label for=${'sb' + i} style="font-size:13px;color:var(--fg-2)">寝た</label><input id=${'sb' + i} type="time" class="timein" value=${r.bed} onChange=${function (e) { setRow(i, 'bed', e.target.value); }} />
            <label for=${'sw' + i} style="font-size:13px;color:var(--fg-2)">起きた</label><input id=${'sw' + i} type="time" class="timein" value=${r.wake} onChange=${function (e) { setRow(i, 'wake', e.target.value); }} />
          </div>
        </div>`;
      })}
    </div>
    <button class="btn small ghost" style="align-self:flex-start" onClick=${addRow}>＋ 二度寝を追加</button>
    ${overlap && html`<div class="warnbox" role="alert">${I.warn}<span>時間が重なっている行があります。寝た〜起きたが重ならないように直してください。</span></div>`}
    <div class="between" style="padding:0 4px"><span style="font-size:13px;color:var(--fg-2)">合計の睡眠時間</span><span class="big" style="font-size:24px">${total ? dur(total) : '--'}</span></div>
    <div class="btns"><button class="btn sub" onClick=${props.onClose}>キャンセル</button><button class="btn" style=${anyBad || overlap ? 'opacity:.5' : ''} onClick=${save}>保存</button></div>
  </${Sheet}>`;
}

/* 仕事の予定（その日だけ外す） */

/* ---------- ToDo ---------- */
function Todo(props) {
  var s = props.store.state, settings = s.settings, cm = catMap(settings);
  var date = props.date, day = getDay(s.days, date);
  var st = taskStats(day);
  var showDone = useState(false);
  var inbox = s.inbox || [];
  var openInbox = inbox.filter(function (x) { return !x.done; }).sort(function (a, b) { return (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : (a.createdAt || 0) - (b.createdAt || 0); });
  var doneInbox = inbox.filter(function (x) { return x.done; }).sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });
  function toggleInbox(x) {
    var on = !x.done;
    props.store.setInbox(function (items) { items.forEach(function (i) { if (i.id === x.id) { i.done = on; i.doneAt = on ? Date.now() : null; } }); return items; });
    if (on) props.toast('「' + x.title + '」を完了にしました');
  }
  function dueLabel(x) {
    if (!x.due) return { text: '期限なし', cls: '' };
    var diff = Math.round((parse(x.due) - parse(todayStr())) / 86400000);
    if (x.done) return { text: '完了 ' + (x.doneAt ? jpDate(ymd(new Date(x.doneAt)), false) : ''), cls: '' };
    if (diff < 0) return { text: '期限 ' + jpDate(x.due, false) + '（' + (-diff) + '日すぎています）', cls: 't-bad' };
    if (diff === 0) return { text: '期限 今日', cls: 't-bad' };
    return { text: '期限 ' + jpDate(x.due) + '（あと' + diff + '日）', cls: diff <= 3 ? 't-bad' : '' };
  }
  function inboxRow(x) {
    var color = colorOf(cm, x.cat), dl = dueLabel(x);
    return html`<div class=${'item' + (x.done ? ' done' : '')} style=${'--c:' + color}>
      <button class=${'box' + (x.done ? ' on' : '')} style="padding:0" aria-label=${x.title + (x.done ? 'を未完了に戻す' : 'を完了にする')} aria-pressed=${String(!!x.done)} onClick=${function () { toggleInbox(x); }}>${x.done ? '✓' : ''}</button>
      <button class="grow" style="border:none;background:none;padding:0;text-align:left" onClick=${function () { props.openInbox(date, x); }}><span class="title">${x.title}</span><span class=${'sub ' + dl.cls}>${x.done && x.doneAt ? '完了 ' + jpDate(ymd(new Date(x.doneAt)), false) : dl.text}</span></button>
      <span class="tag" style=${'--c:' + color}>${catName(cm, x.cat)}</span>
    </div>`;
  }
  function toggle(t) {
    var on = !t.done;
    props.store.setDay(date, function (d) {
      d.tasks.forEach(function (x) { if (x.id === t.id) { x.done = on; x.doneAt = on ? Date.now() : null; } });
      return d;
    });
  }
  function postpone(t) {
    var next = addDays(date, 1);
    props.store.setDay(date, function (d) { d.tasks = d.tasks.filter(function (x) { return x.id !== t.id; }); return d; });
    props.store.setDay(next, function (d) { d.tasks.push(Object.assign({}, t, { id: uid(), start: null, end: null, done: false, doneAt: null })); return d; });
    props.toast('「' + t.title + '」を明日に回しました');
  }
  function row(t) {
    var color = colorOf(cm, t.cat);
    var sub = t.done ? '完了' + (t.doneAt ? ' ' + hm(clockOf(t.doneAt)) : '') : t.start ? t.start + '–' + t.end : '時間なし';
    return html`<div class=${'item' + (t.done ? ' done' : '')} style=${'--c:' + color}>
      <button class=${'box' + (t.done ? ' on' : '')} style="padding:0" aria-label=${t.title + (t.done ? 'を未完了に戻す' : 'を完了にする')} aria-pressed=${String(!!t.done)} onClick=${function () { toggle(t); }}>${t.done ? '✓' : ''}</button>
      <button class="grow" style="border:none;background:none;padding:0;text-align:left" onClick=${function () { props.openTask(date, t); }}><span class="title">${t.title}</span><span class="sub">${sub}</span></button>
      <span class="tag" style=${'--c:' + color}>${catName(cm, t.cat)}</span>
    </div>`;
  }
  var chores = day.tasks.filter(function (t) { return t.kind === 'chore'; }).sort(function (a, b) { return (a.start || '99') < (b.start || '99') ? -1 : 1; });
  var todos = day.tasks.filter(function (t) { return t.kind !== 'chore'; }).sort(function (a, b) { return (a.start || '99') < (b.start || '99') ? -1 : 1; });
  var body;
  if (props.sub === 'plan') {
    body = html`
      <div class="card" style="flex-direction:row;align-items:center;gap:14px">
        <${Ring} done=${st.done} total=${st.total} />
        <div class="stack" style="gap:2px;flex-grow:1"><span style="font-size:16px;font-weight:700">${st.total ? 'あと' + (st.total - st.done) + '件' : 'まだありません'}</span><span class="muted" style="font-size:12px">家事 ${st.choreDone}/${st.choreTotal}・ToDo ${st.todoDone}/${st.todoTotal}</span></div>
        ${ART.broom}
      </div>
      <span class="section-title">家事</span>
      <div class="stack">${chores.length ? chores.map(row) : html`<div class="card"><div class="empty">${ART.washer}<span>右下の＋から、家事リストを選んで追加できます。</span></div></div>`}</div>
      <span class="section-title">ToDo</span>
      <div class="stack">${todos.length ? todos.map(row) : html`<div class="card"><div class="empty"><span>ToDoはありません。</span></div></div>`}</div>
      <div class="between" style="margin-top:4px"><span class="section-title" style="margin:0">いつかやる（日付なし）</span>
        <button class="btn small ghost" style="padding:4px 12px" onClick=${function () { props.openInbox(date, null); }}>＋ 追加</button></div>
      <div class="stack">${openInbox.length ? openInbox.map(inboxRow) : html`<div class="card"><div class="empty"><span>日付を決めずに「どこかでやる」ことを入れておけます。</span></div></div>`}</div>
      ${doneInbox.length > 0 && html`<button style="border:none;background:none;padding:4px 0;text-align:left;font-size:12px;color:var(--accent);font-weight:700" onClick=${function () { showDone[1](!showDone[0]); }}>${showDone[0] ? '完了したものを隠す' : '完了したもの（' + doneInbox.length + '件）を表示'}</button>
        ${showDone[0] && html`<div class="stack">${doneInbox.map(inboxRow)}</div>`}`}
      <p class="muted" style="font-size:11px;margin:0">チェックすると完了の印がつきます（時間割の実績には入りません）。「いつかやる」は、どの日付を開いても同じリストが出ます。</p>`;
  } else {
    var week = [];
    for (var i = 6; i >= 0; i--) { var dd = addDays(date, -i), x = taskStats(getDay(s.days, dd)); week.push({ date: dd, pct: x.total ? Math.round(x.done / x.total * 100) : null }); }

            <span class="muted" style="font-size:12px">家事 ${st.choreDone}/${st.choreTotal}・ToDo ${st.todoDone}/${st.todoTotal}</span></div>
          ${ART.trophy}
        </div>
        <div class="stack" style="border-top:1px solid var(--line-2);padding-top:10px;gap:6px">

          <div style="position:relative;height:80px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;gap:8px;border-bottom:1px solid var(--line)">

          </div>

            ${week.map(function (w) { return html`<span class="stack" style="gap:0"><span style="font-size:11px;font-weight:500">${DOW[parse(w.date).getDay()]}</span><span class="num" style="font-size:10px;color:var(--fg-2)">${w.pct != null ? w.pct + '%' : '-'}</span></span>`; })}

      }) : html`<div class="card"><div class="empty"><span>まだ終わったものはありません。</span></div></div>`}</div>
      ${notDone.length > 0 && html`<span class="section-title">まだのもの</span>
      <div class="stack">${notDone.map(function (t) {
        return html`<div class="item" style="padding:8px 12px"><span style=${'width:8px;height:8px;border-radius:4px;background:' + colorOf(cm, t.cat)}></span>
          <span class="grow"><span style="font-size:13px">${t.title}</span></span>
          <button class="btn small sub" style="border:1.5px solid var(--line)" onClick=${function () { postpone(t); }}>明日に回す</button></div>`;
      })}</div>`}`;
  }
  return html`<div class="app">
    <${DateNav} date=${date} onChange=${props.setDate} onGear=${props.onGear} />
    <${Seg} label="表示" value=${props.sub} onChange=${props.setSub} options=${[['plan', '予定'], ['done', '実績']]} />

  </div>`;
}

/* 家事・ToDoの追加 */
function TaskSheet(props) {
  var settings = props.settings, cm = catMap(settings);
  var day = getDay(props.days, props.date);
  var editing = props.task;
  var kindS = useState(editing ? (editing.kind === 'chore' ? 'chore' : 'todo') : 'chore');
  var kind = kindS[0];
  var picked = useState([]);

    var cursor = toMin(start[0]);
    picked[0].forEach(function (p, i) {
      var s0 = cursor + (i > 0 ? 10 : 0); var e0 = s0 + p.min; cursor = e0;

  var conflicts = [];

    else { var ss = toMin(start[0]), ee = kind === 'chore' && editing ? ss + (editing.min || 30) : toMin(todo[0].end); if (ee <= ss) ee += 1440; conflicts = findConflicts(cm, { key: 'x', cat: editing && editing.kind === 'chore' ? 'house' : todo[0].cat, start: ss, end: ee }, others); }
  }
  var uniq = []; conflicts.forEach(function (c) { if (uniq.indexOf(c) === -1) uniq.push(c); }); conflicts = uniq;

  function togglePick(c) {
    var has = picked[0].some(function (p) { return p.name === c.name; });

  function addCustom() {

    if (saveToList[0] && !settings.chores.some(function (c) { return c.name === t; })) props.store.setSettings(function (st) { st.chores.push({ name: t, min: draftMin[0] }); return st; });
    draft[1]('');
  }
  function adjust(i, d) { var n = picked[0].slice(); n[i] = Object.assign({}, n[i], { min: Math.max(5, n[i].min + d) }); picked[1](n); }
  function save() {
    if (editing) {
      props.store.setDay(props.date, function (d) {
        d.tasks.forEach(function (t) {
          if (t.id !== editing.id) return;
          if (t.kind !== 'chore') { t.title = todo[0].title.trim() || t.title; t.cat = todo[0].cat; }
          if (timed[0]) { t.start = start[0]; t.end = t.kind === 'chore' ? hm2(toMin(start[0]) + (t.min || 30)) : todo[0].end; } else { t.start = null; t.end = null; }
        });
        return d;
      });
      props.toast('保存しました'); props.onClose(); return;
    }
    if (kind === 'chore') {
      if (!picked[0].length) return;
      props.store.setDay(props.date, function (d) {
        plan.forEach(function (p) { d.tasks.push({ id: uid(), kind: 'chore', title: p.name, cat: 'house', min: p.min, start: timed[0] ? hm2(p.start) : null, end: timed[0] ? hm2(p.end) : null, done: false, doneAt: null }); });

      props.toast('ToDoを追加しました');

  }
  function remove() {
    props.store.setDay(props.date, function (d) { d.tasks = d.tasks.filter(function (t) { return t.id !== editing.id; }); d.actuals = d.actuals.filter(function (a) { return a.link !== 't:' + editing.id; }); return d; });

  return html`<${Sheet} title="追加" onClose=${props.onClose}>
    <div class="between"><div class="row" style="gap:10px">${ART.washer}<h2 class="h2" style="font-size:18px">${editing ? '編集する' : '追加する'}</h2></div><span class="muted" style="font-size:13px">${jpDate(props.date)}</span></div>

    ${editing && editing.kind === 'chore' && html`<p style="margin:0;font-size:16px;font-weight:700">${editing.title}<span class="num muted" style="font-size:12px;margin-left:8px">${editing.min || 30}分</span></p>`}

    ${!editing && kind === 'chore' && html`
      <div class="stack"><span class="label">家事リストから選ぶ（複数選べます・数字はかかる時間）</span>
        <div class="chips">${settings.chores.map(function (c) {
          var on = picked[0].some(function (p) { return p.name === c.name; });
          return html`<button class="chip" style="--c:#B08A6A" aria-pressed=${String(on)} onClick=${function () { togglePick(c); }}>${on && html`<span style="color:#8B5E3C;font-weight:700">✓</span>`}${c.name}<span class="min">${c.min}分</span></button>`;
        })}${picked[0].filter(function (p) { return p.custom; }).map(function (p) { return html`<button class="chip" style="--c:#B08A6A" aria-pressed="true" onClick=${function () { togglePick(p); }}>✓ ${p.name}<span class="min">${p.min}分</span></button>`; })}</div>
      </div>
      <div class="stack"><label class="label" for="cus">リストにないときは入力</label>
        <div class="row"><input id="cus" class="input" style="flex-grow:1" value=${draft[0]} onInput=${function (e) { draft[1](e.target.value); }} placeholder="例：換気扇の掃除" />
          <label class="sr" for="cus-min">かかる時間</label>
          <select id="cus-min" class="input" style="width:auto;flex:none" value=${String(draftMin[0])} onChange=${function (e) { draftMin[1](+e.target.value); }}>${[10, 15, 20, 30, 45, 60, 90, 120].map(function (n) { return html`<option value=${String(n)}>${n}分</option>`; })}</select>
          <button class="btn small" style="background:#B08A6A;color:#fff;padding:10px 14px;border-radius:10px;white-space:nowrap;flex:none" onClick=${addCustom}>追加</button></div>
        <label class="row" style="font-size:13px;color:var(--fg-2)"><input type="checkbox" checked=${saveToList[0]} onChange=${function (e) { saveToList[1](e.target.checked); }} style="width:18px;height:18px;accent-color:var(--accent)" />入力した家事を、かかる時間ごと家事リストに保存する</label>
      </div>`}

    ${(kind === 'todo' && !editing) || (editing && editing.kind !== 'chore') ? html`
      <label class="field" for="td-title">やること<input id="td-title" class="input" value=${todo[0].title} onInput=${function (e) { todo[1](Object.assign({}, todo[0], { title: e.target.value })); }} placeholder="例：市役所に書類を出す" /></label>
      <div class="stack"><span class="label">カテゴリ</span><${CatChips} settings=${settings} value=${todo[0].cat} onChange=${function (c) { todo[1](Object.assign({}, todo[0], { cat: c })); }} /></div>

      </div>

/* いつかやる（日付なし）の追加・編集 */
function InboxSheet(props) {
  var settings = props.settings, item = props.item;
  var f = useState({ title: item ? item.title : '', cat: item ? item.cat : 'other', due: item && item.due ? item.due : '' });
  var v = f[0], set = function (k, val) { var n = Object.assign({}, v); n[k] = val; f[1](n); };
  var del = useState(false);
  var moveDate = useState(props.date);
  var q = v.title.trim();
  function save() {
    if (!q) return;
    props.store.setInbox(function (items) {
      if (item) items.forEach(function (i) { if (i.id === item.id) { i.title = q; i.cat = v.cat; i.due = v.due || null; } });
      else items.push({ id: uid(), title: q, cat: v.cat, due: v.due || null, done: false, doneAt: null, createdAt: Date.now() });

  }

    if (!q) return;
    var d0 = moveDate[0];
    props.store.setInbox(function (items) { return items.filter(function (i) { return i.id !== item.id; }); });
    props.store.setDay(d0, function (d) { d.tasks.push({ id: uid(), kind: 'todo', title: q, cat: v.cat, start: null, end: null, done: false, doneAt: null }); return d; });
    props.toast(jpDate(d0) + 'のToDoに入れました'); props.onClose();
  }
  function remove() { props.store.setInbox(function (items) { return items.filter(function (i) { return i.id !== item.id; }); }); props.toast('削除しました'); props.onClose(); }
  return html`<${Sheet} title="いつかやる" onClose=${props.onClose}>
    <div class="row" style="gap:10px">${ART.clip}<h2 class="h2" style="font-size:18px">${item ? 'いつかやる を編集' : 'いつかやる を追加'}</h2></div>

      <span class="label">やる日が決まったら</span>
      <div class="row" style="flex-wrap:wrap"><label class="sr" for="ib-move">やる日</label><input id="ib-move" type="date" class="timein" value=${moveDate[0]} onChange=${function (e) { if (e.target.value) moveDate[1](e.target.value); }} />

  function range(m, a) {

    var d = parse(a), y = d.getFullYear(), mo = d.getMonth(), n = new Date(y, mo + 1, 0).getDate(), r = [];
    for (var k = 1; k <= n; k++) r.push(ymd(new Date(y, mo, k)));
    return r;
  }
  function shift(n) {
    if (mode === 'week') anchorS[1](addDays(anchor, 7 * n));
    else if (mode === 'month') { var d = parse(anchor); anchorS[1](ymd(new Date(d.getFullYear(), d.getMonth() + n, 1))); }
    else { var d2 = parse(anchor); anchorS[1](ymd(new Date(d2.getFullYear() + n, 0, 1))); }
  }
  var bars = [], label = '', cur = [], prevVals = [];
  if (mode === 'year') {
    var yr = parse(anchor).getFullYear(); label = yr + '年';
    for (var mo = 0; mo < 12; mo++) {
      var vs = range('month', ymd(new Date(yr, mo, 1))).map(function (d) { return metricValue(s.days, d, metric); }).filter(function (v) { return v != null; });

      cur = cur.concat(vs);
    }
    for (var pm = 0; pm < 12; pm++) prevVals = prevVals.concat(range('month', ymd(new Date(yr - 1, pm, 1))).map(function (d) { return metricValue(s.days, d, metric); }).filter(function (v) { return v != null; }));
  } else {
    var dates = range(mode, anchor);
    label = mode === 'week' ? jpDate(dates[0]) + ' 〜 ' + jpDate(dates[6]) : parse(anchor).getFullYear() + '年' + (parse(anchor).getMonth() + 1) + '月';
    dates.forEach(function (d, i) {
      var v = metricValue(s.days, d, metric);
      bars.push({ label: mode === 'week' ? DOW[parse(d).getDay()] : (i % 5 === 0 || i === dates.length - 1 ? String(parse(d).getDate()) : ''), value: v, today: d === t });
      if (v != null) cur.push(v);
    });
    var pd = mode === 'week' ? range('week', addDays(anchor, -7)) : range('month', ymd(new Date(parse(anchor).getFullYear(), parse(anchor).getMonth() - 1, 1)));
    prevVals = pd.map(function (d) { return metricValue(s.days, d, metric); }).filter(function (v) { return v != null; });
  }
  var curAvg = avg(cur), prevAvg = avg(prevVals);
  var periodName = mode === 'week' ? '前週' : mode === 'month' ? '前月' : '前年';
  // 体重は減るとよい、歩数は増えるとよい、カロリーは評価しない
  function tone(d) { if (d == null || metric === 'kcal') return ''; var good = metric === 'weight' ? d <= 0 : d >= 0; return good ? 'chip-good' : 'chip-bad'; }

  function saveNumber(field, v) {
    props.store.setDay(date, function (d) { d[field] = v; return d; });
  }

  return html`<div class="stack" style="gap:14px">
    <div class="between">
      <div class="datenav">
        <button class="iconbtn plain" aria-label="前の日" onClick=${function () { dateS[1](addDays(date, -1)); }}>‹</button>

        ${date !== t && html`<button class="todaybtn" onClick=${function () { dateS[1](t); }}>今日</button>`}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <button class="card" style="border:none;text-align:left;gap:4px" onClick=${function () { sheet[1]({ type: 'weight' }); }}>
        <span class="between label">体重<span style="color:var(--accent);font-weight:700">${typeof day.weight === 'number' ? '編集' : '入力'}</span></span>
        <span class="big">${typeof day.weight === 'number' ? html`${day.weight.toFixed(1)}<small>kg</small>` : '--'}</span>
        ${weightPrevDiff != null && html`<span style="font-size:12px;font-weight:500" class=${weightPrevDiff <= 0 ? 't-good' : 't-bad'}>前日より ${fmtDiff(weightPrevDiff, 'weight')}</span>`}
        ${goal != null && lw && html`<span class="muted" style="font-size:12px">目標 ${goal.toFixed(1)}kg まで ${lw.value - goal > 0 ? 'あと ' + (lw.value - goal).toFixed(1) + 'kg' : '達成！'}</span>`}
        ${goal == null && html`<span class="muted" style="font-size:11px">目標体重は下の「目標を設定」から</span>`}
      </button>
      <button class="card" style="border:none;text-align:left;gap:4px" onClick=${function () { sheet[1]({ type: 'steps' }); }}>
        <span class="between label">歩数<span style="color:var(--accent);font-weight:700">${typeof day.steps === 'number' ? '編集' : '入力'}</span></span>
        <span class="big">${typeof day.steps === 'number' ? html`${day.steps.toLocaleString('ja-JP')}<small>歩</small>` : '--'}</span>
        ${stepsPrevDiff != null && html`<span style="font-size:12px;font-weight:500" class=${stepsPrevDiff >= 0 ? 't-good' : 't-bad'}>前日より ${fmtDiff(stepsPrevDiff, 'steps')}</span>`}
        <span class="muted" style="font-size:11px">iPhoneのヘルスケアの歩数を入力</span>
      </button>
    </div>

    <div class="card">
      <div class="between"><span class="h2">食事</span><span class="muted" style="font-size:12px">${kcal != null ? '合計 ' + kcal.toLocaleString('ja-JP') + 'kcal' : meals.length + '件'}</span></div>
      ${MEAL_SLOTS.map(function (slot) {
        var list = meals.filter(function (m) { return m.slot === slot[0]; });
        var sub = list.filter(function (m) { return typeof m.kcal === 'number'; }).reduce(function (a, m) { return a + m.kcal; }, 0);
        return html`<div class="stack" style="gap:6px;border-top:1px solid var(--line-2);padding-top:10px">
          <div class="between"><span style="font-size:13px;font-weight:700;color:var(--fg-2)">${slot[1]}${sub ? html`<span class="num muted" style="font-weight:500;margin-left:8px;font-size:12px">${sub}kcal</span>` : ''}</span>
            <button class="btn small ghost" style="padding:4px 12px" onClick=${function () { sheet[1]({ type: 'meal', slot: slot[0], item: null }); }}>＋ 追加</button></div>
          ${list.length ? list.map(function (m) {
            return html`<button class="between" style="border:none;background:var(--surface-2);border-radius:10px;padding:8px 12px;text-align:left" onClick=${function () { sheet[1]({ type: 'meal', slot: slot[0], item: m }); }}>
              <span style="font-size:14px;min-width:0;overflow-wrap:anywhere">${m.name}</span>
              <span class="num muted" style="font-size:12px;white-space:nowrap">${typeof m.kcal === 'number' ? m.kcal + 'kcal' : ''}</span>
            </button>`;
          }) : html`<span class="muted" style="font-size:12px">まだ記録していません</span>`}
        </div>`;
      })}
      <p class="muted" style="font-size:11px;margin:0">カロリーは書かなくても保存できます。わからないときは、写真をClaudeに送ると目安を計算してもらえます。</p>
    </div>

    <div class="card" style="padding:14px 12px 12px">
      <${Seg} label="グラフの項目" value=${metric} onChange=${metricS[1]} options=${[['weight', '体重'], ['steps', '歩数'], ['kcal', 'カロリー']]} />
      <${Seg} label="期間" value=${mode} onChange=${function (m) { modeS[1](m); anchorS[1](todayStr()); }} options=${[['week', '週'], ['month', '月'], ['year', '年']]} />
      <div class="between"><button class="iconbtn plain" aria-label="前へ" onClick=${function () { shift(-1); }}>‹</button><span style="font-size:13px;font-weight:500;text-align:center">${label}</span><button class="iconbtn plain" aria-label="次へ" onClick=${function () { shift(1); }}>›</button></div>
      <div class="stack" style="gap:6px;padding:0 4px">
        <span class="label">${mode === 'week' ? 'この週' : mode === 'month' ? 'この月' : 'この年'}の平均</span>
        <span class="big" style="font-size:28px">${fmtMetric(curAvg, metric)}</span>
        <div class="chips" style="gap:6px">
          ${curAvg != null && prevAvg != null && html`<span class=${tone(curAvg - prevAvg) || 'chip-good'} style=${metric === 'kcal' ? 'background:var(--accent-soft);color:var(--fg)' : ''}>${periodName}の平均より ${fmtDiff(curAvg - prevAvg, metric)}</span>`}
          ${metric === 'weight' && goal != null && curAvg != null && html`<span class=${curAvg <= goal ? 'chip-good' : 'chip-bad'}>目標より ${fmtDiff(curAvg - goal, 'weight')}</span>`}
          ${curAvg == null && html`<span class="muted" style="font-size:12px">この期間の記録はまだありません。</span>`}
        </div>
      </div>
      <${MetricChart} bars=${bars} metric=${metric} mode=${mode} goal=${metric === 'weight' ? goal : null} avg=${curAvg} />
      ${mode === 'year' && html`<span class="muted" style="font-size:11px;padding-left:4px">月ごとの平均です</span>`}
      ${metric === 'kcal' && html`<span class="muted" style="font-size:11px;padding-left:4px">カロリーを書いた日だけ集計します</span>`}
      <button class="btn small ghost" style="align-self:flex-start" onClick=${function () { sheet[1]({ type: 'goal' }); }}>${goal != null ? '目標体重 ' + goal.toFixed(1) + 'kg を変更' : '目標体重を設定'}</button>

    ${sheet[0] && sheet[0].type === 'goal' && html`<${NumberSheet} title="目標体重" label="目標体重" unit="kg" step="0.1" decimal=${true} value=${goal} placeholder="55.0"
      onSave=${function (v) { props.store.setSettings(function (st) { st.diet = Object.assign({}, st.diet, { goalWeight: v }); return st; }); props.toast('目標体重を保存しました'); }}
      onClear=${function () { props.store.setSettings(function (st) { st.diet = Object.assign({}, st.diet, { goalWeight: null }); return st; }); }} onClose=${function () { sheet[1](null); }} />`}
  </div>`;
}

function NumberSheet(props) {
  var f = useState(props.value != null ? String(props.value) : '');
  var num = parseFloat(String(f[0]).replace(',', '.'));
  var ok = !isNaN(num) && num > 0;
  function save() { if (!ok) return; props.onSave(props.decimal ? Math.round(num * 10) / 10 : Math.round(num)); props.onClose(); }
  return html`<${Sheet} title=${props.title} onClose=${props.onClose}>
    <h2 class="h2" style="font-size:18px">${props.title}</h2>
    ${props.note && html`<p class="muted" style="margin:0;font-size:12px;line-height:1.6">${props.note}</p>`}
    <div class="row" style="gap:10px">
      <label class="sr" for="num-in">${props.label}</label>
      <input id="num-in" class="input num" style="font-size:24px;font-weight:600;text-align:right" type="number" inputmode=${props.decimal ? 'decimal' : 'numeric'} step=${props.step} min="0"
        value=${f[0]} placeholder=${props.placeholder} onInput=${function (e) { f[1](e.target.value); }} onKeyDown=${function (e) { if (e.key === 'Enter') save(); }} />
      <span style="font-size:16px;font-weight:700">${props.unit}</span>
    </div>
    <div class="btns"><button class="btn sub" onClick=${props.onClose}>キャンセル</button><button class="btn" style=${ok ? '' : 'opacity:.5'} onClick=${save}>保存</button></div>
    ${props.value != null && html`<button class="btn danger" onClick=${function () { props.onClear(); props.onClose(); }}>記録を消す</button>`}
  </${Sheet}>`;
}

function MealSheet(props) {
  var settings = props.settings, foods = settings.foods || [];
  var item = props.item;
  var f = useState({ slot: item ? item.slot : props.slot, name: item ? item.name : '', kcal: item && typeof item.kcal === 'number' ? String(item.kcal) : '' });
  var v = f[0], set = function (k, val) { var n = Object.assign({}, v); n[k] = val; f[1](n); };
  var saveFood = useState(!item);
  var del = useState(false);
  var q = v.name.trim();
  var shown = q ? foods.filter(function (fd) { return fd.name.indexOf(q) !== -1; }) : foods;
  var exists = foods.some(function (fd) { return fd.name === q; });
  function save() {
    if (!q) return;
    var k = parseInt(v.kcal, 10);
    var kcal = isNaN(k) ? null : Math.max(0, k);
    var entry = { id: item ? item.id : uid(), slot: v.slot, name: q, kcal: kcal };
    props.store.setDay(props.date, function (d) {
      d.meals = (d.meals || []).filter(function (m) { return m.id !== entry.id; });
      d.meals.push(entry);
      return d;
    });
    if (saveFood[0] && !exists) props.store.setSettings(function (st) { st.foods = (st.foods || []).concat([{ name: q, kcal: kcal }]); return st; });
    props.toast(item ? '食事を保存しました' : '食事を記録しました');
    props.onClose();
  }
  function remove() {
    props.store.setDay(props.date, function (d) { d.meals = (d.meals || []).filter(function (m) { return m.id !== item.id; }); return d; });
    props.toast('食事を削除しました'); props.onClose();
  }
  return html`<${Sheet} title="食事" onClose=${props.onClose}>
    <div class="between"><h2 class="h2" style="font-size:18px">${item ? '食事を編集' : '食事を記録'}</h2><span class="muted" style="font-size:13px">${jpDate(props.date)}</span></div>
    <${Seg} label="食事の種類" value=${v.slot} onChange=${function (x) { set('slot', x); }} options=${MEAL_SLOTS} />
    <label class="field" for="meal-name">食べたもの（必須）<input id="meal-name" class="input" value=${v.name} onInput=${function (e) { set('name', e.target.value); }} placeholder="例：鮭おにぎり、サラダチキン" /></label>
    ${foods.length > 0 && html`<div class="stack"><span class="label">マイ食品から選ぶ${q && shown.length !== foods.length ? '（「' + q + '」を含むもの）' : ''}</span>
      <div class="chips" style="max-height:150px;overflow-y:auto">${shown.length ? shown.map(function (fd) {
        return html`<button class="chip" style="--c:#6DB58A" aria-pressed=${String(fd.name === q)} onClick=${function () { f[1](Object.assign({}, v, { name: fd.name, kcal: typeof fd.kcal === 'number' ? String(fd.kcal) : '' })); }}>${fd.name}${typeof fd.kcal === 'number' && html`<span class="min">${fd.kcal}kcal</span>`}</button>`;
      }) : html`<span class="muted" style="font-size:12px">一致するマイ食品はありません</span>`}</div></div>`}
    <label class="field" for="meal-kcal">カロリー（わかれば）
      <span class="row"><input id="meal-kcal" class="input num" type="number" inputmode="numeric" min="0" value=${v.kcal} onInput=${function (e) { set('kcal', e.target.value); }} placeholder="例：180" /><span style="font-size:14px;font-weight:700;color:var(--fg)">kcal</span></span>
    </label>
    ${q && !exists && html`<label class="row" style="font-size:13px;color:var(--fg-2)"><input type="checkbox" checked=${saveFood[0]} onChange=${function (e) { saveFood[1](e.target.checked); }} style="width:18px;height:18px;accent-color:var(--accent)" />「${q}」をマイ食品に保存する</label>`}
    <div class="btns"><button class="btn sub" onClick=${props.onClose}>キャンセル</button><button class="btn" style=${q ? '' : 'opacity:.5'} onClick=${save}>保存</button></div>
    ${item && (del[0] ? html`<div class="btns"><button class="btn sub" onClick=${function () { del[1](false); }}>やめる</button><button class="btn danger" onClick=${remove}>本当に削除する</button></div>` : html`<button class="btn danger" onClick=${function () { del[1](true); }}>この食事を削除</button>`)}
  </${Sheet}>`;
}

/* ---------- 設定 ---------- */
function Settings(props) {
  var store = props.store, s = store.state, settings = s.settings;
  var editCat = useState(null);
  var goalS = useState(false);
  var newChore = useState(''), newChoreMin = useState(30);
  var importS = useState(null);
  var fileRef = useRef(null);
  function upd(fn) { store.setSettings(fn); }
  var tops = settings.cats.filter(function (c) { return !c.parent; });
  function ruleText(c) {
    if (c.rule === 'always') return ['常にOK', 'good'];
    if (c.rule === 'any') return ['どれとでもOK', 'good'];
    if (c.rule === 'none') return ['重なりNG', 'bad'];
    var names = (c.allow || []).map(function (id) { var x = settings.cats.find(function (k) { return k.id === id; }); return x ? x.name : null; }).filter(Boolean);
    return [(names.length ? names.join('・') : 'なし') + 'とだけOK', 'part'];
  }
  function exportData() {
    var data = JSON.stringify({ app: 'schedule-book', version: 1, exportedAt: new Date().toISOString(), settings: settings, days: s.days, inbox: s.inbox || [] }, null, 2);
    try {
      var blob = new Blob([data], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'schedule-book-' + todayStr() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      props.toast('書き出しました');
    } catch (e) { props.toast('書き出せませんでした'); }
  }
  function onFile(e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { try { var d = JSON.parse(r.result); if (!d || d.app !== 'schedule-book') throw new Error(); importS[1](d); } catch (x) { props.toast('このファイルは読み込めません'); } };
    r.readAsText(f); e.target.value = '';
  }
  return html`<div class="app">
    <div class="top"><div class="row" style="gap:4px;margin-left:-10px"><button class="iconbtn plain" aria-label="戻る" onClick=${props.onBack}>${I.back}</button><h1 style="margin:0;font-size:20px">設定</h1></div></div>

    <span class="section-title">仕事の定例予定</span>
    <div class="card">
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px">

          var on = settings.work.days.indexOf(d) !== -1;
          return html`<button aria-pressed=${String(on)} aria-label=${DOW[d] + '曜日'} style=${'height:40px;border-radius:10px;font-weight:700;font-size:13px;border:1.5px solid ' + (on ? '#8A93A3' : 'var(--line)') + ';background:' + (on ? '#8A93A3' : 'var(--surface)') + ';color:' + (on ? '#1C2230' : 'var(--muted)')} onClick=${function () { upd(function (st) { st.work.days = on ? st.work.days.filter(function (x) { return x !== d; }) : st.work.days.concat([d]); return st; }); }}>${DOW[d]}</button>`;
        })}
      </div>
      <div class="row" style="flex-wrap:wrap">
        <label for="w-start" style="font-size:13px;color:var(--fg-2)">時間</label>
        <input id="w-start" type="time" class="timein" value=${settings.work.start} onChange=${function (e) { var v = e.target.value; if (v) upd(function (st) { st.work.start = v; return st; }); }} />
        <span class="muted">〜</span>
        <label class="sr" for="w-end">終了</label>
        <input id="w-end" type="time" class="timein" value=${settings.work.end} onChange=${function (e) { var v = e.target.value; if (v) upd(function (st) { st.work.end = v; return st; }); }} />
      </div>
      <div class="between"><span style="font-size:13px">祝日は仕事を入れない</span><${Switch} label="祝日は仕事を入れない" on=${settings.work.skipHoliday} onChange=${function (x) { upd(function (st) { st.work.skipHoliday = x; return st; }); }} /></div>
      <span class="muted" style="font-size:12px;line-height:1.6">選んだ曜日の時間割に自動で入ります。休みの日は、時間割で仕事をタップすると外せます。</span>
    </div>

    <span class="section-title">睡眠の目標</span>
    <div class="card" style="padding:0;gap:0">
      ${[['weekday', '平日'], ['holiday', '休日']].map(function (k, i) {
        var g = settings.goal[k[0]], m = toMin(g.wake) - toMin(g.bed); if (m <= 0) m += 1440;
        return html`<button class="between" style=${'border:none;background:none;padding:12px 14px;text-align:left;' + (i === 0 ? 'border-bottom:1px solid var(--line-2)' : '')} onClick=${function () { goalS[1](true); }}>
          <span style="font-size:13px;font-weight:700;width:36px">${k[1]}</span><span class="num" style="flex-grow:1;font-size:14px">${hm(toMin(g.bed))} → ${hm(toMin(g.wake))}</span>
          <span class="num" style="font-size:14px;font-weight:600;color:var(--accent)">${dur(m)}</span><span class="muted">›</span></button>`;
      })}
    </div>

    <span class="section-title">家事リストとかかる時間</span>
    <div class="card" style="padding:0;gap:0">
      ${settings.chores.map(function (c, i) {
        return html`<div class="row" style="gap:6px;padding:8px 12px;border-bottom:1px solid var(--line-2)">

function CatSheet(props) {
  var settings = props.settings;
  var c = settings.cats.find(function (x) { return x.id === props.id; });
  var f = useState(c ? JSON.parse(JSON.stringify(c)) : null);
  var del = useState(false);
  var newSub = useState('');
  if (!c || !f[0]) return null;
  var v = f[0], set = function (k, val) { var n = Object.assign({}, v); n[k] = val; f[1](n); };
  var isSub = !!v.parent;
  var tops = settings.cats.filter(function (x) { return !x.parent; });
  var subs = settings.cats.filter(function (x) { return x.parent === v.id; });
  function save() {
    props.store.setSettings(function (st) { st.cats = st.cats.map(function (x) { return x.id === v.id ? v : x; }); return st; });
    props.toast('カテゴリを保存しました'); props.onClose();
  }
  function remove() {
    props.store.setSettings(function (st) {
      st.cats = st.cats.filter(function (x) { return x.id !== v.id && x.parent !== v.id; });
      st.cats.forEach(function (x) { if (x.allow) x.allow = x.allow.filter(function (a) { return a !== v.id; }); });
      return st;
    });
    props.toast('カテゴリを削除しました（使っていた予定は「その他」として表示されます）'); props.onClose();
  }
  function addSub() {
    var name = newSub[0].trim(); if (!name) return;
    var id = 'c' + uid();
    props.store.setSettings(function (st) { st.cats.push({ id: id, name: name, color: v.color, parent: v.id }); return st; });
    newSub[1]('');
  }
  return html`<${Sheet} title="カテゴリ" onClose=${props.onClose}>
    <h2 class="h2" style="font-size:18px">カテゴリを編集</h2>
    <label class="field" for="cat-name">名前<input id="cat-name" class="input" value=${v.name} onInput=${function (e) { set('name', e.target.value); }} /></label>
    <div class="stack"><span class="label">色</span>
      <div class="chips">${PALETTE.map(function (p) { return html`<button class="swatch" style=${'--c:' + p} aria-label=${'色 ' + p} aria-pressed=${String(v.color.toUpperCase() === p.toUpperCase())} onClick=${function () { set('color', p); }}></button>`; })}
        <label class="row" style="font-size:12px;color:var(--muted)">ほかの色<input type="color" value=${v.color} onInput=${function (e) { set('color', e.target.value.toUpperCase()); }} style="width:36px;height:30px;border:none;background:none;padding:0" /></label></div>
    </div>
    ${isSub ? html`<p class="muted" style="margin:0;font-size:13px">重なりのルールは「${(settings.cats.find(function (x) { return x.id === v.parent; }) || {}).name}」と同じです。</p>` : html`
      <fieldset style="border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
        <legend class="label" style="padding:0;margin-bottom:6px">重なりのルール</legend>
        ${[['always', '常にOK', '相手のルールに関係なく、何と重なっても警告しない'], ['any', 'どれとでもOK', '自分からは警告しない（相手がNGなら警告）'], ['pick', '指定したカテゴリとだけOK', '選んだカテゴリ以外と重なると警告'], ['none', '重なりNG', '何と重なっても警告（「常にOK」のカテゴリは除く）']].map(function (r) {
          return html`<label class="row" style="align-items:flex-start;font-size:13px;line-height:1.5"><input type="radio" name="rule" checked=${v.rule === r[0]} onChange=${function () { set('rule', r[0]); }} style="margin-top:3px;accent-color:var(--accent)" />

        })}
      </fieldset>
      ${v.rule === 'pick' && html`<div class="stack" style="background:var(--surface-2);border-radius:10px;padding:10px">
        <span class="label">重なってOKなカテゴリ</span>
        <div class="chips">${tops.map(function (t) {
          var on = (v.allow || []).indexOf(t.id) !== -1;
          return html`<button class="chip" style=${'--c:' + t.color} aria-pressed=${String(on || t.rule === 'always')} disabled=${t.rule === 'always'} onClick=${function () { set('allow', on ? v.allow.filter(function (a) { return a !== t.id; }) : (v.allow || []).concat([t.id])); }}>${(on || t.rule === 'always') && '✓ '}${t.name}${t.rule === 'always' ? '（常にOK）' : ''}</button>`;

        <div class="row"><label class="sr" for="sub-new">小カテゴリの名前</label><input id="sub-new" class="input" style="flex-grow:1" value=${newSub[0]} onInput=${function (e) { newSub[1](e.target.value); }} placeholder="小カテゴリを追加" /><button class="btn small" style="padding:10px 14px;border-radius:10px;white-space:nowrap;flex:none" onClick=${addSub}>追加</button></div>

  </${Sheet}>`;
